<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step2 能登半島地震後オルソ画像</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    html, body, #map { height: 100%; margin: 0; }
    .opacity { position: absolute; z-index: 1000; bottom: 24px; left: 10px; background: #fff;
               padding: 6px 10px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.3); font: 13px sans-serif; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="opacity">オルソ透過率 <input id="op" type="range" min="0" max="1" step="0.05" value="1"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    // 初期中心：輪島市中心部（オルソ画像の撮影範囲）
    const map = L.map('map').setView([37.3905, 136.8990], 15);
    const attr = '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">地理院タイル</a>';

    const std = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',
      { attribution: attr, maxZoom: 18 }).addTo(map);
    const pale = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',
      { attribution: attr, maxZoom: 18 });

    // 能登半島地震後のオルソ画像（2024/4/5～4/26撮影）
    const noto = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/20240102noto_0405_0426do/{z}/{x}/{y}.png',
      { attribution: attr, maxZoom: 18 }).addTo(map);

    L.control.layers(
      { '標準地図': std, '淡色地図': pale },
      { '能登半島地震後オルソ（2024/4/5～4/26）': noto },
      { collapsed: false }
    ).addTo(map);
    L.control.scale({ imperial: false }).addTo(map);

    document.getElementById('op').addEventListener('input', e => noto.setOpacity(e.target.value));
  </script>
</body>
</html>
